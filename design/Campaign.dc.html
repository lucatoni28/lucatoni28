<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Be+Vietnam+Pro:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #04121f; color: #ffffff;
      font-family: "Be Vietnam Pro", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #6bdbff; text-decoration: none; }
    a:hover { color: #00e5e5; }
    .px { image-rendering: pixelated; }
    .scan::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(180deg, #04121f 0%, #061c2e 55%, #04121f 100%);">

  <div style="display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 12px; background: linear-gradient(180deg, #00c8d7, #0099b0); border-bottom: 3px solid #0a1f33; box-shadow: 0 3px 0 #0a1f33;">
    <div style="width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid #0a1f33; border-radius: 5px; background: rgba(4,18,31,.42); box-shadow: 0 3px 0 #0a1f33;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg>
    </div>
    <div style="flex-grow: 1; font-family: Orbitron, sans-serif; font-weight: 900; font-size: 15px; letter-spacing: .12em; color: #ffffff; text-shadow: 0 2px 0 rgba(4,18,31,.65);">CHIẾN DỊCH</div>
    <div style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 9px; border: 2px solid #0a1f33; border-radius: 17px; background: linear-gradient(180deg, #0a3a5a, #04121f); box-shadow: inset 0 1px 0 rgba(255,255,255,.12);">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffcc00" stroke="#8a6a00" stroke-width="2"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#8a6a00" stroke-width="1.6"></circle><path d="M12 9v6" stroke="#8a6a00" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 13px; color: #ffcc00;">12.480</span>
    </div>
  </div>

  <div style="padding: 12px 14px 10px; background: linear-gradient(180deg, rgba(10,58,90,.55), rgba(4,18,31,0));">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .22em; color: #ff8c2a;">CHƯƠNG 1</span>
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; letter-spacing: .05em; color: #ffffff;">VÀNH ĐAI SAO</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 9px;">
      <div style="position: relative; flex-grow: 1; height: 10px; border: 2px solid #000000; border-radius: 2px; background: #0a1f33; box-shadow: inset 0 2px 3px rgba(0,0,0,.8); overflow: hidden;">
        <div style="width: 50%; height: 100%; background: linear-gradient(180deg, #7bf0ff, #00e5e5 52%, #0089a8);"></div>
        <div style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 31px, rgba(0,0,0,.5) 31px 33px);"></div>
      </div>
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 11px; color: #6bdbff;">6/12 MÀN</span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; overflow: hidden;">
    <svg viewBox="0 0 390 480" width="390" height="480" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
      <defs>
        <linearGradient id="trailDone" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ffcc00" stop-opacity=".75"></stop>
          <stop offset="1" stop-color="#00e5e5" stop-opacity=".75"></stop>
        </linearGradient>
      </defs>
      <g fill="#bfe4ff" opacity=".45">
        <circle cx="34" cy="120" r="1.1"></circle><circle cx="352" cy="180" r="1.3"></circle>
        <circle cx="286" cy="42" r="0.9"></circle><circle cx="78" cy="252" r="1.2"></circle>
        <circle cx="330" cy="330" r="1"></circle><circle cx="48" cy="418" r="1.2"></circle>
      </g>
      <path d="M62 430 C 96 424, 122 394, 150 372 S 214 384, 246 392 S 312 344, 318 314 S 262 258, 224 254 S 140 232, 120 216 S 172 174, 198 166 C 236 152, 262 124, 284 96 C 240 60, 140 58, 80 80"
            fill="none" stroke="#0a3a5a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M62 430 C 96 424, 122 394, 150 372 S 214 384, 246 392 S 312 344, 318 314 S 262 258, 224 254 S 140 232, 120 216 S 172 174, 198 166"
            fill="none" stroke="url(#trailDone)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"></path>
      <path d="M198 166 C 236 152, 262 124, 284 96 C 240 60, 140 58, 80 80"
            fill="none" stroke="#3d5c78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"></path>
    </svg>

    <div style="position: absolute; left: 38px; top: 406px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #8a6a00; background: linear-gradient(180deg, #ffe27a, #ffcc00 52%, #e09a00); box-shadow: 0 3px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.55);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; color: #3a2500;">1</span>
    </div>
    <div style="position: absolute; left: 126px; top: 348px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #8a6a00; background: linear-gradient(180deg, #ffe27a, #ffcc00 52%, #e09a00); box-shadow: 0 3px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.55);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; color: #3a2500;">2</span>
    </div>
    <div style="position: absolute; left: 222px; top: 368px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #8a6a00; background: linear-gradient(180deg, #ffe27a, #ffcc00 52%, #e09a00); box-shadow: 0 3px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.55);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; color: #3a2500;">3</span>
    </div>
    <div style="position: absolute; left: 294px; top: 290px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #8a6a00; background: linear-gradient(180deg, #ffe27a, #ffcc00 52%, #e09a00); box-shadow: 0 3px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.55);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; color: #3a2500;">4</span>
    </div>
    <div style="position: absolute; left: 200px; top: 230px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #8a6a00; background: linear-gradient(180deg, #ffe27a, #ffcc00 52%, #e09a00); box-shadow: 0 3px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.55);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; color: #3a2500;">5</span>
    </div>
    <div style="position: absolute; left: 96px; top: 192px; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #8a6a00; background: linear-gradient(180deg, #ffe27a, #ffcc00 52%, #e09a00); box-shadow: 0 3px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.55);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; color: #3a2500;">6</span>
    </div>

    <div style="position: absolute; left: 162px; top: 130px; width: 72px; height: 72px; display: grid; place-items: center;">
      <div style="position: absolute; inset: -8px; border-radius: 50%; background: radial-gradient(circle, rgba(0,229,229,.34) 0%, rgba(0,229,229,0) 68%);"></div>
      <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(0,229,229,.65);"></div>
      <div style="position: relative; width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #00e5e5; background: linear-gradient(180deg, #0f7fb8, #064066); box-shadow: 0 4px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.24), 0 0 20px rgba(0,229,229,.55);">
        <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 19px; color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,.5);">7</span>
      </div>
    </div>
    <div style="position: absolute; left: 240px; top: 182px; padding: 3px 9px; border-radius: 3px; background: #ffcc00; box-shadow: 0 2px 0 #0a1f33;">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 9px; letter-spacing: .1em; color: #3a2500;">ĐANG Ở ĐÂY</span>
    </div>

    <div style="position: absolute; left: 262px; top: 74px; width: 44px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 50%; border: 3px solid #2b4a66; background: linear-gradient(180deg, #14324c, #0a2438); box-shadow: inset 0 2px 4px rgba(0,0,0,.6);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 10px; color: #4d7a9c;">8</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#4d7a9c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    </div>

    <div style="position: absolute; left: 46px; top: 46px; width: 68px; height: 68px; display: grid; place-items: center; border-radius: 50%; border: 3px solid #7a2246; background: linear-gradient(180deg, #3a1030, #1c0a1e); box-shadow: inset 0 2px 5px rgba(0,0,0,.6), 0 0 18px rgba(255,74,157,.22);">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ff4a9d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8" aria-hidden="true"><path d="M12 3 4 7v5c0 4.6 3.2 8.3 8 9.4 4.8-1.1 8-4.8 8-9.4V7z"></path><path d="M9.5 11.5h.01M14.5 11.5h.01M9.5 15.5h5"></path></svg>
    </div>
    <div style="position: absolute; left: 26px; top: 120px; padding: 3px 9px; border-radius: 3px; border: 1px solid rgba(255,74,157,.5); background: rgba(28,10,30,.9);">
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 9px; letter-spacing: .1em; color: #ff8ad8;">TRÙM · MÀN 12</span>
    </div>

    <div style="position: absolute; left: 0; right: 0; top: 0; height: 56px; background: linear-gradient(180deg, #061c2e, rgba(6,28,46,0)); pointer-events: none;"></div>
  </div>

  <div class="scan" style="position: relative; padding: 14px 14px 18px; background: linear-gradient(180deg, #0a3a5a, #062033); border-top: 3px solid #00e5e5; box-shadow: 0 -4px 0 #0a1f33;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <div class="px" style="position: relative; width: 56px; height: 56px; flex-shrink: 0; display: grid; place-items: center; border-radius: 6px; border: 2px solid #ff5a6a; background: linear-gradient(135deg, #0a3a5a, #0a1f33); overflow: hidden;">
        <div style="width: 74px; height: 59px; transform: scale(.72); background: url(./aduka.png) 0 0 / 1036px 59px no-repeat;"></div>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="display: flex; align-items: baseline; gap: 7px;">
          <span style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .18em; color: #ff8c2a;">MÀN 07</span>
          <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 15px; color: #ffffff;">VÀNH ĐAI BĂNG</span>
        </div>
        <div style="margin-top: 5px; font-size: 11px; color: #9fc4dd;">Gió mạnh 18–22 · địa hình băng dễ vỡ</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 7px;">
          <span style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .14em; color: #5d8aa8;">ĐỘ KHÓ</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffcc00" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"></path></svg>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffcc00" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"></path></svg>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffcc00" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"></path></svg>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#25455f" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"></path></svg>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#25455f" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9z"></path></svg>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 12px;">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 11px; border-radius: 5px; border: 2px solid #0a5c8c; background: rgba(2,14,26,.5);">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffcc00" stroke="#8a6a00" stroke-width="2"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#8a6a00" stroke-width="1.6"></circle></svg>
        <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 13px; color: #ffcc00;">+850</span>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 11px; border-radius: 5px; border: 2px solid #7a4ad0; background: rgba(2,14,26,.5);">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#b98cff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="11" rx="1.6"></rect><path d="M3 13h18M12 9v11M6.5 9C4.5 9 4 5 6.5 5S12 9 12 9s3-4 5.5-4S19.5 9 17.5 9"></path></svg>
        <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 13px; color: #b98cff;">RƠI ĐỒ 12%</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 54px; margin-top: 10px; border-radius: 6px; border: 2px solid #7a5a00; background: linear-gradient(180deg, #ffe27a 0%, #ffcc00 44%, #f0a400 100%); box-shadow: 0 4px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.16);">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#3a2500" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h14"></path><path d="m13 7 5 5-5 5"></path><path d="M21 4v16"></path></svg>
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 16px; letter-spacing: .14em; color: #3a2500;">XUẤT TRẬN</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
