<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Be+Vietnam+Pro:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #04121f; color: #ffffff;
      font-family: "Be Vietnam Pro", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: #6bdbff; text-decoration: none; }
    a:hover { color: #00e5e5; }
    .px { image-rendering: pixelated; }
    .scan::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(120% 70% at 50% 8%, #0e3a5c 0%, #072338 42%, #04121f 78%, #020a14 100%);">

  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; inset: 0; opacity: .85;" aria-hidden="true">
    <g fill="#bfe4ff">
      <circle cx="24" cy="62" r="1.2" opacity=".7"></circle><circle cx="88" cy="30" r="0.9" opacity=".5"></circle>
      <circle cx="147" cy="96" r="1.5" opacity=".9"></circle><circle cx="203" cy="44" r="0.8" opacity=".45"></circle>
      <circle cx="264" cy="78" r="1.1" opacity=".65"></circle><circle cx="318" cy="36" r="1.4" opacity=".8"></circle>
      <circle cx="362" cy="112" r="0.9" opacity=".5"></circle><circle cx="52" cy="146" r="1.3" opacity=".75"></circle>
      <circle cx="120" cy="182" r="0.8" opacity=".4"></circle><circle cx="232" cy="158" r="1.2" opacity=".7"></circle>
      <circle cx="298" cy="196" r="0.9" opacity=".5"></circle><circle cx="352" cy="228" r="1.4" opacity=".85"></circle>
      <circle cx="18" cy="244" r="1.0" opacity=".55"></circle><circle cx="166" cy="262" r="0.8" opacity=".4"></circle>
      <circle cx="276" cy="292" r="1.2" opacity=".7"></circle><circle cx="70" cy="318" r="0.9" opacity=".5"></circle>
      <circle cx="338" cy="352" r="1.1" opacity=".6"></circle><circle cx="196" cy="372" r="0.8" opacity=".38"></circle>
      <circle cx="42" cy="404" r="1.3" opacity=".7"></circle><circle cx="308" cy="436" r="0.9" opacity=".45"></circle>
      <circle cx="132" cy="454" r="1.0" opacity=".55"></circle><circle cx="248" cy="492" r="0.8" opacity=".35"></circle>
      <circle cx="368" cy="512" r="1.2" opacity=".6"></circle><circle cx="86" cy="536" r="0.9" opacity=".42"></circle>
    </g>
    <g stroke="#6bdbff" stroke-width="1" opacity=".22" fill="none">
      <path d="M300 20 L338 58"></path><path d="M56 96 L82 122"></path>
    </g>
  </svg>

  <div style="position: absolute; left: -70px; top: 250px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(0,229,229,.16) 0%, rgba(0,229,229,0) 68%); pointer-events: none;"></div>
  <div style="position: absolute; right: -90px; top: 90px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(255,140,42,.13) 0%, rgba(255,140,42,0) 66%); pointer-events: none;"></div>

  <div style="position: relative; padding: 52px 24px 0; text-align: center;">
    <div style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .34em; color: #6bdbff; opacity: .82;">ĐẤU TRƯỜNG PHÁO BINH</div>
    <h1 style="margin: 10px 0 0; font-family: Orbitron, sans-serif; font-weight: 900; font-size: 42px; letter-spacing: .04em; line-height: 1.16; background: linear-gradient(180deg, #ffffff 0%, #ffe98a 46%, #ffcc00 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(255,204,0,.34)) drop-shadow(0 3px 0 rgba(4,18,31,.9));">STAR ARENA</h1>
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px;">
      <div style="width: 62px; height: 2px; background: linear-gradient(90deg, rgba(0,229,229,0), #00e5e5);"></div>
      <div style="width: 7px; height: 7px; transform: rotate(45deg); background: #ffcc00; box-shadow: 0 0 10px rgba(255,204,0,.8);"></div>
      <div style="width: 62px; height: 2px; background: linear-gradient(90deg, #00e5e5, rgba(0,229,229,0));"></div>
    </div>
    <div style="margin-top: 11px; font-family: Orbitron, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .2em; color: #9fc4dd;">ADUKA · THOR · MAP STAR</div>
  </div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
    <div style="position: relative; width: 150px; height: 96px; display: flex; align-items: center; justify-content: center;">
      <div style="position: absolute; inset: 14px 0; border: 1px dashed rgba(107,219,255,.28); border-radius: 50%;"></div>
      <div style="position: absolute; width: 108px; height: 108px; border-radius: 50%; background: radial-gradient(circle, rgba(107,219,255,.3) 0%, rgba(107,219,255,0) 65%);"></div>
      <div class="px" style="position: relative; width: 83px; height: 55px; background: url(./thor.png) 0 0 / 664px 55px no-repeat;"></div>
    </div>

    <div style="position: relative; width: 260px; height: 210px; display: flex; align-items: flex-end; justify-content: center;">
      <div style="position: absolute; bottom: 22px; width: 232px; height: 62px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(0,229,229,.26) 0%, rgba(0,229,229,.06) 52%, rgba(0,229,229,0) 76%);"></div>
      <div style="position: absolute; bottom: 34px; width: 178px; height: 30px; border-radius: 50%; background: linear-gradient(180deg, #0d4a70, #062c46); border: 2px solid #0a5c8c; box-shadow: 0 0 22px rgba(0,229,229,.32), inset 0 2px 0 rgba(255,255,255,.14);"></div>
      <div style="position: absolute; bottom: 40px; width: 150px; height: 18px; border-radius: 50%; background: rgba(2,14,26,.55);"></div>
      <div class="px" style="position: relative; bottom: 44px; width: 222px; height: 177px; background: url(./aduka.png) 0 0 / 3108px 177px no-repeat; filter: drop-shadow(0 8px 14px rgba(2,10,20,.75));"></div>
    </div>
  </div>

  <div style="position: relative; padding: 0 22px 26px; display: flex; flex-direction: column; gap: 12px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .16em; color: #ffcc00;">TÊN CHỈ HUY</span>
      </div>
      <div class="scan" style="position: relative; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 2px solid #0a5c8c; border-radius: 5px; background: linear-gradient(180deg, rgba(13,74,112,.6), rgba(6,44,70,.85)); box-shadow: inset 0 2px 5px rgba(0,0,0,.55), 0 3px 0 #0a1f33;">
        <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 17px; letter-spacing: .06em; color: #ffffff;">LUCA</span>
        <span style="width: 2px; height: 21px; background: #00e5e5; box-shadow: 0 0 8px rgba(0,229,229,.9);"></span>
        <span style="flex-grow: 1;"></span>
        <span style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 10px; color: #5d8aa8;">4/12</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 14px; height: 56px; border-radius: 6px; border: 2px solid #7a5a00; background: linear-gradient(180deg, #ffe27a 0%, #ffcc00 44%, #f0a400 100%); box-shadow: 0 4px 0 #0a1f33, inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.16);">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3a2500" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
      <span style="font-family: Orbitron, sans-serif; font-weight: 900; font-size: 17px; letter-spacing: .13em; color: #3a2500;">VÀO CHIẾN DỊCH</span>
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 9px; height: 48px; border-radius: 5px; border: 2px solid #0a5c8c; background: linear-gradient(180deg, rgba(13,74,112,.85), rgba(6,44,70,.95)); box-shadow: 0 3px 0 #0a1f33, inset 0 1px 0 rgba(255,255,255,.14);">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#6bdbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>
        <span style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .1em; color: #bfe4ff;">ĐẤU NHANH</span>
      </div>
      <div style="width: 48px; height: 48px; display: grid; place-items: center; border-radius: 5px; border: 2px solid #0a5c8c; background: linear-gradient(180deg, rgba(13,74,112,.85), rgba(6,44,70,.95)); box-shadow: 0 3px 0 #0a1f33, inset 0 1px 0 rgba(255,255,255,.14);">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#6bdbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-2.4-2.6M20 16H7l2.4 2.6"></path><circle cx="19" cy="8" r="1.6"></circle><circle cx="5" cy="16" r="1.6"></circle></svg>
      </div>
      <div style="width: 48px; height: 48px; display: grid; place-items: center; border-radius: 5px; border: 2px solid #0a5c8c; background: linear-gradient(180deg, rgba(13,74,112,.85), rgba(6,44,70,.95)); box-shadow: 0 3px 0 #0a1f33, inset 0 1px 0 rgba(255,255,255,.14);">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#6bdbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.6 8.4a5 5 0 0 1 0 7.2"></path><path d="M18.4 5.6a9 9 0 0 1 0 12.8"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 10px; color: #5d8aa8;">
      <span>Bản học tập · v2.0</span>
      <span style="opacity: .5;">·</span>
      <span>Tiến trình lưu trên máy</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
